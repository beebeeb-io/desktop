[package]
name = "beebeeb-desktop"
version = "0.1.0"
edition = "2024"
description = "Beebeeb desktop app — Tauri shell around the Rust sync engine"
publish = false

[lib]
name = "beebeeb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Folder picker for the first-launch sync-root chooser (spec 030 step 2)
tauri-plugin-dialog = "2"
# desktop.toml config persistence
toml = "0.8"
# `dirs::config_dir()` to locate ~/.config/beebeeb/ (or platform equivalent)
dirs = "6"
# Used by the .beebeeb-sync.lock helper for liveness checks of a prior
# agent's pid (`libc::kill(pid, 0)`) and hostname recording.
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
# `time` for the existing update-loop sleeps; `rt`/`rt-multi-thread` to
# spawn the sync engine on a background task; `sync` for the eventual
# cancellation channel between Tauri lifecycle and the engine.
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Per-file sync state tracking (Phase 1 Task 1 — desktop sync client plan).
# `bundled` ships SQLite source so we don't depend on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTP client for the API client extracted from repos/cli/ (Phase 1 Task 2).
# `stream` is reserved for streaming chunk uploads in a later task.
reqwest = { version = "0.12", features = ["json"] }
# Convenience error type for the daemon's surface — the plan signs API
# methods with `anyhow::Result` (Phase 1 Task 2).
anyhow = "1"
# UUID parsing used by `EngineBridge::hydrate_file` to convert a string
# file_id into bytes for `beebeeb_core::kdf::derive_file_key`.
uuid = { version = "1", features = ["v4", "serde"] }

# Sync engine + crypto from the core repo. Path deps so we build against
# the local checkout; `[patch."https://github.com/beebeeb-io/core"]`
# keeps git-dep references inside sub-crates pointing at the same tree
# (mirrors the pattern in repos/cli/Cargo.toml).
beebeeb-sync = { path = "../../core/beebeeb-sync" }
beebeeb-core = { path = "../../core/beebeeb-core" }
beebeeb-types = { path = "../../core/beebeeb-types" }

# Unix-only liveness check; on Windows we currently fall back to a
# conservative "always alive" — see lockfile.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.14"
libc = "0.2"

# Windows Cloud Files API — Phase 2 Task 6 of the desktop sync client
# plan. The `windows` crate ships generated bindings to Win32 APIs;
# we only pull in the modules we actually use:
#   - Win32_Storage_CloudFilters: CfRegisterSyncRoot, CfCreatePlaceholders,
#     CF_CALLBACK_INFO and friends.
#   - Win32_Storage_FileSystem: FILE_BASIC_INFO struct used inside
#     CF_FS_METADATA when minting a placeholder.
#   - Win32_Foundation: PCWSTR / HRESULT / HANDLE.
#   - Win32_System_Com: GUID type used for the provider id.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"

[patch."https://github.com/beebeeb-io/core"]
beebeeb-core = { path = "../../core/beebeeb-core" }
beebeeb-sync = { path = "../../core/beebeeb-sync" }
beebeeb-types = { path = "../../core/beebeeb-types" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
