name: Rust suite
description: >
  Compile every target of one Rust crate once and run its tests, with the counted truth line
  (scripts/assert-cargo-test-counts.py) and the evidence upload. One job per crate and OS calls this;
  a new crate is one more job of a few lines (docs/ci/2026-11-11-rust-ci-speed.md, "Adding a crate").

inputs:
  crate-dir:
    description: Directory holding the crate's Cargo.toml.
    default: src-tauri
  evidence-name:
    description: Name of the uploaded evidence artifact.
    required: true
  cache-key:
    description: Shared key of the dependency cache (one per crate and OS).
    required: true
  test-threads:
    description: libtest threads. The suite waits (sockets, SQLite, timers) far more than it computes, so more threads than cores is faster.
    default: "8"

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    # GitHub-hosted only: a self-hosted runner keeps its own warm CARGO_TARGET_DIR (docs/ci/self-hosted-runners.md).
    # Saved only by pushes to a base branch: a pull request restores its base branch's cache and never writes a
    # 1 GB copy of its own. `cache-on-failure`: a red test run still leaves the compiled dependencies behind.
    - name: Cache cargo
      if: runner.environment == 'github-hosted'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: ${{ inputs.crate-dir }}
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' }}
        cache-on-failure: true

    - name: Build settings and test directories
      shell: bash
      run: |
        # Line tables keep file:line in a panic's backtrace; full debuginfo only makes the test binary 3x larger
        # and the build slower. On a hosted runner nothing is incremental (every run starts from the cache).
        echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
        if [ "${{ runner.environment }}" = github-hosted ]; then echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"; fi
        echo "RUST_TEST_THREADS=${{ inputs.test-threads }}" >> "$GITHUB_ENV"
        # Temporary test files (hundreds of SQLite databases, one fsync per commit) go to memory on Linux.
        # Config stays out of the runner's real home there. TEMP/TMP are Windows', TMPDIR is Linux' and macOS'.
        tmp="$RUNNER_TEMP/beebeeb-tmp"
        if [ "$RUNNER_OS" = Linux ] && [ -d /dev/shm ] && [ -w /dev/shm ]; then
          tmp="/dev/shm/beebeeb-tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
        fi
        mkdir -p "$tmp"
        if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -w "$tmp")"; fi
        { echo "TMPDIR=$tmp"; echo "TEMP=$tmp"; echo "TMP=$tmp"; echo "BB_TEST_TMP=$tmp"; } >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = Linux ]; then
          mkdir -p "$RUNNER_TEMP/beebeeb-xdg-config"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/beebeeb-xdg-config" >> "$GITHUB_ENV"
        fi
        # Windows: `python` (python3 can be the Store stub there); elsewhere python3.
        if [ "$RUNNER_OS" = Windows ]; then echo "BB_PY=python" >> "$GITHUB_ENV"; else echo "BB_PY=python3" >> "$GITHUB_ENV"; fi

    - name: Test count guard self-test
      shell: bash
      run: |
        "$BB_PY" scripts/assert-cargo-test-counts.py --self-test
        "$BB_PY" scripts/assert-test-build-covers-all-targets.py --self-test

    # The old `cargo check --all-targets` step compiled the crate a second time in another profile. The test build
    # compiles the library, the binaries, the examples and every test target; only a bench target would be left out,
    # so the guard fails the job the day the crate gets one.
    - name: The test build covers every target
      shell: bash
      working-directory: ${{ inputs.crate-dir }}
      run: |
        cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
        "$BB_PY" "$GITHUB_WORKSPACE/scripts/assert-test-build-covers-all-targets.py" "$RUNNER_TEMP/cargo-metadata.json"

    - name: Compile every target
      shell: bash
      working-directory: ${{ inputs.crate-dir }}
      run: |
        build_exit=0
        CARGO_TERM_COLOR=never cargo test --locked --no-run > "$RUNNER_TEMP/cargo-build.log" 2>&1 || build_exit=$?
        cat "$RUNNER_TEMP/cargo-build.log"
        echo "$build_exit" > "$RUNNER_TEMP/cargo-build.exit"
        exit "$build_exit"

    - name: Run Rust tests
      shell: bash
      working-directory: ${{ inputs.crate-dir }}
      run: |
        cargo_exit=0
        CARGO_TERM_COLOR=never cargo test --locked > "$RUNNER_TEMP/cargo-test.log" 2>&1 || cargo_exit=$?
        cat "$RUNNER_TEMP/cargo-test.log"
        echo "$cargo_exit" > "$RUNNER_TEMP/cargo-test.exit"
        "$BB_PY" "$GITHUB_WORKSPACE/scripts/assert-cargo-test-counts.py" "$RUNNER_TEMP/cargo-test.log" --cargo-exit-code "$cargo_exit"

    - name: Remove temporary test files
      if: always()
      shell: bash
      run: |
        case "${BB_TEST_TMP:-}" in /dev/shm/beebeeb-tmp-*) rm -rf "$BB_TEST_TMP" ;; esac

    - name: Upload Rust evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          ${{ runner.temp }}/cargo-build.log
          ${{ runner.temp }}/cargo-build.exit
          ${{ runner.temp }}/cargo-test.log
          ${{ runner.temp }}/cargo-test.exit
