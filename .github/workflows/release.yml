name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0
        required: true
        type: string

permissions: {}

env:
  APP_NAME: Beebeeb
  APP_VERSION: 0.1.0
  BUNDLE_IDENTIFIER: io.beebeeb.desktop

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is disabled for now: the File Provider extension doesn't support universal
          # builds yet (arch-detection gap in scripts/build-fileprovider-extension.sh) and
          # Developer ID/notary credentials aren't wired into CI (see task 0342). Re-add once
          # both are sorted — the macOS-only steps below are already gated on `runner.os` and
          # need no other change.
          # - name: macOS
          #   os: macos-latest
          #   target: universal-apple-darwin
          #   rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libfuse-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release config
        if: runner.os == 'macOS'
        run: bash scripts/macos-release-preflight.sh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
          MACOS_FILE_PROVIDER_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_FILE_PROVIDER_PROVISION_PROFILE_BASE64 }}
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.TAURI_WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} -- --locked

      - name: Validate signed macOS artifact
        if: runner.os == 'macOS'
        run: |
          app_path="$(find src-tauri/target -path '*/release/bundle/macos/Beebeeb.app' -type d | head -n 1)"
          test -n "$app_path"
          bash scripts/macos-release-preflight.sh "$app_path"

      # Stage exactly the files we want to publish into a clean dist/ directory, then upload that
      # directory as-is. Bundle directories are not safe to glob directly or wholesale:
      # - Multiple narrow multi-line patterns in one upload-artifact `path:` have been observed to
      #   silently keep only 1 of N real matches (confirmed 2026-07-02, msi/*.msi + *.msi.zip +
      #   *.msi.zip.sig kept only the .msi).
      # - A broad directory glob (`bundle/appimage/*`, `bundle/deb/*`) sweeps in linuxdeploy's and
      #   dpkg's internal staging trees — hundreds of unrelated .so files, the unbundled raw binary,
      #   dpkg's data.tar.gz — none of which should ever be a release asset (confirmed same day).
      # This list is the VERIFIED real output of `tauri build`'s own "Found artifacts:" log line —
      # not the candidate names it *looks for* (which include zip/tar.gz updater-bundle variants
      # this Tauri config never actually produces; confirmed 2026-07-02 by a hard build failure).
      # Each installer format gets its own direct .sig — there is no separate zip-wrapped bundle.
      - name: Stage release assets (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig dist/

      - name: Stage release assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig dist/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig dist/

      - name: Stage release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig dist/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb dist/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig dist/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm dist/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig dist/

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-macos
          path: dist/*
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-windows
          path: dist/*
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # Publish whatever platforms succeeded rather than requiring all three — `needs: build`
    # reports one aggregate result for the whole matrix, so a single failing platform (e.g.
    # macOS, still blocked on a separate File Provider gap) would otherwise skip this job even
    # when the other platforms built and signed cleanly.
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Check for any artifacts
        id: check
        run: |
          if find artifacts -type f | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-v${{ inputs.version }}
          name: Beebeeb Desktop ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Single catch-all instead of a per-extension allowlist — the upload steps above now
          # glob whole bundle directories, so every real bundle type flows through automatically
          # instead of needing a matching pattern added here each time (this is what silently
          # dropped .rpm and the NSIS .exe before).
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
