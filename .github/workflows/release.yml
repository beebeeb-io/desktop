name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver version to release or promote, for example 0.2.1
        required: true
        type: string
      channel:
        description: Channel manifest to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable
      publish_existing:
        description: Publish only the selected channel manifest for an existing desktop-v<version> release
        required: true
        default: false
        type: boolean

permissions: {}

env:
  APP_NAME: Beebeeb
  APP_VERSION: 0.1.0
  BUNDLE_IDENTIFIER: io.beebeeb.desktop

jobs:
  validate-release-inputs:
    name: Validate release inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate version and channel
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Desktop release version '$RELEASE_VERSION' must be plain semver like 0.2.1. Build-once releases do not bake -alpha/-beta suffixes into artifacts."
            exit 1
          fi

          case "$RELEASE_CHANNEL" in
            alpha|beta|stable) ;;
            *)
              echo "::error::Desktop release channel '$RELEASE_CHANNEL' must be alpha, beta, or stable."
              exit 1
              ;;
          esac

  validate-release-notes:
    name: Validate release notes
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release notes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate authored release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          notes_path="RELEASE_NOTES.md"

          if [[ ! -f "$notes_path" ]]; then
            echo "::error file=$notes_path::Missing RELEASE_NOTES.md for Beebeeb Desktop $RELEASE_VERSION. Author the release notes at the repo root, commit them, then rerun this workflow. See docs/RELEASING.md."
            exit 1
          fi

          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          notes_path = pathlib.Path("RELEASE_NOTES.md")
          notes = notes_path.read_text(encoding="utf-8")
          exact_version = re.compile(rf"(?<![0-9A-Za-z.-]){re.escape(version)}(?![0-9A-Za-z-]|\.[0-9A-Za-z])")

          if not exact_version.search(notes):
              print(
                  f"::error file=RELEASE_NOTES.md::RELEASE_NOTES.md must mention the exact release version {version}. "
                  "Update the title/body for this release and commit it before rerunning the workflow. See docs/RELEASING.md.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

  test:
    name: Run release test gate
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libfuse-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun test

      - name: Run Rust tests
        working-directory: src-tauri
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/beebeeb-xdg-config
          TMPDIR: ${{ runner.temp }}/beebeeb-tmp
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$TMPDIR"
          cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is disabled for now: the File Provider extension doesn't support universal
          # builds yet (arch-detection gap in scripts/build-fileprovider-extension.sh) and
          # Developer ID/notary credentials aren't wired into CI (see task 0342). Re-add once
          # both are sorted — the macOS-only steps below are already gated on `runner.os` and
          # need no other change.
          # - name: macOS
          #   os: macos-latest
          #   target: universal-apple-darwin
          #   rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libfuse-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set app version for this release
        shell: bash
        env:
          # Never interpolate ${{ inputs.version }} directly into the run:
          # script body — GitHub substitutes it into the script TEXT before
          # the shell runs, so a version string containing shell metacharacters
          # would be a script-injection vector. Routing it through env: keeps
          # the substitution on the YAML side and the shell only ever sees it
          # as an ordinary, safely-quoted variable.
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Tauri's bundler names every artifact (.msi, .AppImage, .deb, .rpm,
          # etc.) after tauri.conf.json's own `version` field. Build-once
          # channel promotion requires these filenames and the baked
          # BEEBEEB_RELEASE_VERSION to be identical across alpha, beta, and
          # stable, so the release version is plain semver on every platform.
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Desktop release version '$RELEASE_VERSION' must be plain semver like 0.2.1. Channel is selected separately by the workflow input."
            exit 1
          fi

          jq --arg version "$RELEASE_VERSION" '.version = $version' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "BEEBEEB_RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate release config
        if: runner.os == 'macOS'
        run: bash scripts/macos-release-preflight.sh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
          MACOS_FILE_PROVIDER_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_FILE_PROVIDER_PROVISION_PROFILE_BASE64 }}
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.TAURI_WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} -- --locked

      - name: Validate signed macOS artifact
        if: runner.os == 'macOS'
        run: |
          app_path="$(find src-tauri/target -path '*/release/bundle/macos/Beebeeb.app' -type d | head -n 1)"
          test -n "$app_path"
          bash scripts/macos-release-preflight.sh "$app_path"

      # Stage exactly the files we want to publish into a clean release-assets/ directory, then upload that
      # directory as-is. Bundle directories are not safe to glob directly or wholesale:
      # - Multiple narrow multi-line patterns in one upload-artifact `path:` have been observed to
      #   silently keep only 1 of N real matches (confirmed 2026-07-02, msi/*.msi + *.msi.zip +
      #   *.msi.zip.sig kept only the .msi).
      # - A broad directory glob (`bundle/appimage/*`, `bundle/deb/*`) sweeps in linuxdeploy's and
      #   dpkg's internal staging trees — hundreds of unrelated .so files, the unbundled raw binary,
      #   dpkg's data.tar.gz — none of which should ever be a release asset (confirmed same day).
      # This list is the VERIFIED real output of `tauri build`'s own "Found artifacts:" log line —
      # not the candidate names it *looks for* (which include zip/tar.gz updater-bundle variants
      # this Tauri config never actually produces; confirmed 2026-07-02 by a hard build failure).
      # Each installer format gets its own direct .sig — there is no separate zip-wrapped bundle.
      - name: Stage release assets (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig release-assets/

      - name: Stage release assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi release-assets/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig release-assets/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release-assets/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig release-assets/

      - name: Stage release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig release-assets/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig release-assets/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm release-assets/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig release-assets/

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-macos
          path: release-assets/*
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-windows
          path: release-assets/*
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beebeeb-desktop-linux
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # Default (implicit) success-gating: this job only runs if `needs: build` succeeds, which
    # requires EVERY enabled matrix platform to succeed — currently Windows + Linux, both of
    # which are the full supported set now that macOS is commented out of the matrix entirely
    # (see the matrix comment above). Do NOT relax this to "publish if any platform succeeded"
    # while only fully-supported platforms are enabled — that was only safe for as long as an
    # explicitly-optional, expected-to-fail platform (macOS) sat in the matrix alongside the
    # required ones; without that, a silent partial release (e.g. Linux succeeds, Windows
    # doesn't) would ship with a missing supported platform and no indication anything is wrong.
    # If macOS is re-enabled as an optional platform later, this needs a deliberate per-platform
    # required/optional check again, not a blanket `!cancelled()`.
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-v${{ inputs.version }}
          name: Beebeeb Desktop ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Single catch-all instead of a per-extension allowlist — the upload steps above now
          # glob whole bundle directories, so every real bundle type flows through automatically
          # instead of needing a matching pattern added here each time (this is what silently
          # dropped .rpm and the NSIS .exe before).
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish update manifest
    # Keep manifest publishing in this workflow instead of a separate
    # `on: release` workflow. Releases created with the default GITHUB_TOKEN do
    # not trigger other workflows, and publish_existing=true must be able to
    # promote an already-built desktop-vX.Y.Z release without running build.
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        needs.validate-release-inputs.result == 'success' &&
        (
          inputs.publish_existing ||
          (
            needs.validate-release-notes.result == 'success' &&
            needs.build.result == 'success' &&
            needs.release.result == 'success'
          )
        )
      }}
    needs:
      - validate-release-inputs
      - validate-release-notes
      - build
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout releases repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: beebeeb-io/releases
          ref: main
          token: ${{ secrets.RELEASES_PUSH_TOKEN }}
          persist-credentials: false
          path: releases-repo

      - name: Generate desktop channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: desktop-v${{ inputs.version }}
          VER: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')

          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Desktop release version '$VER' must be plain semver like 0.2.1. Channel is selected separately by the workflow input."
            exit 1
          fi

          case "$CHANNEL" in
            stable) MANIFEST_PATH="desktop/latest.json" ;;
            beta) MANIFEST_PATH="desktop/beta.json" ;;
            alpha) MANIFEST_PATH="desktop/alpha.json" ;;
            *)
              echo "::error::Desktop release channel '$CHANNEL' must be alpha, beta, or stable."
              exit 1
              ;;
          esac

          echo "DESKTOP_RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "DESKTOP_MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"

          # The Tauri updater verifies update bundles against the embedded pubkey
          # in tauri.conf.json using the .sig files produced at build time.
          # Windows and Linux must fail closed if their signatures are absent.
          # macOS is still disabled in the release matrix, so its updater bundle
          # filename is a best-effort carry-forward until macOS release output is
          # verified. Missing macOS signatures omit darwin entries instead of
          # blocking Windows/Linux manifest publishing.
          #
          # Keep the Windows updater targets split by installer type. The
          # Tauri updater first searches windows-x86_64-{nsis,msi} based on
          # the bundle type patched into the installed app, then falls back to
          # windows-x86_64. Fresh Windows installs are documented as NSIS
          # setup.exe installs, so the generic fallback intentionally points at
          # NSIS; MSI-installed clients still receive MSI through the typed key.
          MACOS_BUNDLE="Beebeeb_${VER}_universal.app.tar.gz"
          LINUX_BUNDLE="Beebeeb_${VER}_amd64.AppImage"
          WINDOWS_NSIS_BUNDLE="Beebeeb_${VER}_x64-setup.exe"
          WINDOWS_MSI_BUNDLE="Beebeeb_${VER}_x64_en-US.msi"

          fetch_sig() {
            curl --proto '=https' --tlsv1.2 -fsSL "$1"
          }

          fetch_optional_sig() {
            local url="$1"

            if ! curl --proto '=https' --tlsv1.2 -fsSL "$url"; then
              echo "::notice::Optional macOS signature not found at $url; omitting macOS manifest entries" >&2
            fi
          }

          SIG_MACOS=$(fetch_optional_sig "${BASE_URL}/${MACOS_BUNDLE}.sig")
          SIG_LINUX=$(fetch_sig "${BASE_URL}/${LINUX_BUNDLE}.sig")
          SIG_WINDOWS_NSIS=$(fetch_sig "${BASE_URL}/${WINDOWS_NSIS_BUNDLE}.sig")
          SIG_WINDOWS_MSI=$(fetch_sig "${BASE_URL}/${WINDOWS_MSI_BUNDLE}.sig")

          mkdir -p releases-repo/desktop

          jq -n \
            --arg ver "$VER" \
            --arg notes "$NOTES" \
            --arg date "$DATE" \
            --arg base_url "$BASE_URL" \
            --arg macos_bundle "$MACOS_BUNDLE" \
            --arg linux_bundle "$LINUX_BUNDLE" \
            --arg windows_nsis_bundle "$WINDOWS_NSIS_BUNDLE" \
            --arg windows_msi_bundle "$WINDOWS_MSI_BUNDLE" \
            --arg sig_macos "$SIG_MACOS" \
            --arg sig_linux "$SIG_LINUX" \
            --arg sig_windows_nsis "$SIG_WINDOWS_NSIS" \
            --arg sig_windows_msi "$SIG_WINDOWS_MSI" \
            '{
              version: $ver,
              notes: $notes,
              pub_date: $date,
              platforms: (
                {
                  "linux-x86_64": {
                    url: ($base_url + "/" + $linux_bundle),
                    signature: $sig_linux
                  },
                  "windows-x86_64": {
                    url: ($base_url + "/" + $windows_nsis_bundle),
                    signature: $sig_windows_nsis
                  },
                  "windows-x86_64-nsis": {
                    url: ($base_url + "/" + $windows_nsis_bundle),
                    signature: $sig_windows_nsis
                  },
                  "windows-x86_64-msi": {
                    url: ($base_url + "/" + $windows_msi_bundle),
                    signature: $sig_windows_msi
                  }
                }
                + (
                  if $sig_macos == "" then
                    {}
                  else
                    {
                      "darwin-aarch64": {
                        url: ($base_url + "/" + $macos_bundle),
                        signature: $sig_macos
                      },
                      "darwin-x86_64": {
                        url: ($base_url + "/" + $macos_bundle),
                        signature: $sig_macos
                      }
                    }
                  end
                )
              )
            }' > "releases-repo/$MANIFEST_PATH"

      - name: Commit and push to releases repo
        working-directory: releases-repo
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${RELEASES_PUSH_TOKEN}@github.com/beebeeb-io/releases.git"
          git add "$DESKTOP_MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "$DESKTOP_MANIFEST_PATH already up to date"
          else
            git commit -m "desktop: publish $DESKTOP_RELEASE_CHANNEL manifest $TAG"
            git push
          fi
        env:
          RELEASES_PUSH_TOKEN: ${{ secrets.RELEASES_PUSH_TOKEN }}
          TAG: desktop-v${{ inputs.version }}
