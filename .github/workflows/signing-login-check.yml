name: Signing login check

# Proves the Windows signing trust boundary (docs/RELEASING.md, "Windows Authenticode") without building or
# signing anything: the Azure login runs through the GitHub environment `desktop-release`, exactly as the
# release build does. Dispatched from `main` (or a `release/*` branch) it must pass; dispatched from any other
# branch the environment refuses the job before it starts, and the run must fail.
#
# The second job proves the updater key the same way: it signs one fixed throwaway file with the environment's
# `TAURI_SIGNING_PRIVATE_KEY` and its `_PASSWORD` and checks that the signature was made by
# the key baked into `tauri.conf.json`. Nothing is published; the signature is never printed or uploaded.

on:
  workflow_dispatch:

permissions: {}

jobs:
  azure-login:
    name: Azure login through desktop-release
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login for Artifact Signing (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: The login reached the signing subscription
        run: |
          set -euo pipefail
          az account show --query id -o tsv > /dev/null
          echo "Azure login through desktop-release: ok (ref ${GITHUB_REF})"

  updater-key:
    name: Updater key through desktop-release
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Installed in a step that does not hold the key: nothing is downloaded in the step that does.
      - name: Install the Tauri CLI (no key in this step)
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/signer"
          cd "$RUNNER_TEMP/signer"
          printf '{"private":true}\n' > package.json
          bun add --exact @tauri-apps/cli@2.11.4
          ./node_modules/.bin/tauri --version

      - name: Sign one throwaway file with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not readable through the desktop-release environment"
            exit 1
          fi
          printf 'beebeeb signing check, not a release\n' > "$RUNNER_TEMP/beebeeb-signing-check.txt"
          # The key and its password are read from the environment by the signer; they are not arguments. Its
          # output is dropped: it would print the signature.
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign "$RUNNER_TEMP/beebeeb-signing-check.txt" > /dev/null
          test -s "$RUNNER_TEMP/beebeeb-signing-check.txt.sig"

      - name: The signature was made by the key baked into the app
        run: |
          set -euo pipefail
          node scripts/check-updater-signature-key.mjs --sig "$RUNNER_TEMP/beebeeb-signing-check.txt.sig"
          rm -f "$RUNNER_TEMP/beebeeb-signing-check.txt" "$RUNNER_TEMP/beebeeb-signing-check.txt.sig"
          echo "Updater key through desktop-release: ok (ref ${GITHUB_REF})"
