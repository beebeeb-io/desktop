name: Publish release manifest

on:
  release:
    types: [published]

permissions: {}

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout releases repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: beebeeb-io/releases
          ref: main
          token: ${{ secrets.RELEASES_PUSH_TOKEN }}
          persist-credentials: false
          path: releases-repo

      - name: Generate desktop/latest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VER=${TAG#desktop-v}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          # The Tauri updater verifies update bundles against the embedded pubkey
          # in tauri.conf.json using the .sig files produced at build time.
          # An empty signature would cause every client to reject the update.
          #
          # Asset naming matches the artifacts uploaded by .github/workflows/release.yml:
          # - macOS: universal-apple-darwin → single .app.tar.gz(.sig) for both archs
          # - Linux: x86_64-unknown-linux-gnu → .AppImage.tar.gz(.sig)
          # - Windows: x86_64-pc-windows-msvc → .msi.zip(.sig)
          MACOS_BUNDLE="Beebeeb_${VER}_universal.app.tar.gz"
          LINUX_BUNDLE="Beebeeb_${VER}_amd64.AppImage.tar.gz"
          WINDOWS_BUNDLE="Beebeeb_${VER}_x64_en-US.msi.zip"

          fetch_sig() {
            # Download the .sig file contents (raw minisign signature blob).
            # Curl fails the workflow if the file is missing — this is the desired
            # behavior: better to fail publishing than ship an empty signature.
            curl --proto '=https' --tlsv1.2 -fsSL "$1"
          }

          SIG_MACOS=$(fetch_sig "${BASE_URL}/${MACOS_BUNDLE}.sig")
          SIG_LINUX=$(fetch_sig "${BASE_URL}/${LINUX_BUNDLE}.sig")
          SIG_WINDOWS=$(fetch_sig "${BASE_URL}/${WINDOWS_BUNDLE}.sig")

          mkdir -p releases-repo/desktop

          jq -n \
            --arg ver "$VER" \
            --arg notes "$NOTES" \
            --arg date "$DATE" \
            --arg base_url "$BASE_URL" \
            --arg macos_bundle "$MACOS_BUNDLE" \
            --arg linux_bundle "$LINUX_BUNDLE" \
            --arg windows_bundle "$WINDOWS_BUNDLE" \
            --arg sig_macos "$SIG_MACOS" \
            --arg sig_linux "$SIG_LINUX" \
            --arg sig_windows "$SIG_WINDOWS" \
            '{
              version: $ver,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": {
                  url: ($base_url + "/" + $macos_bundle),
                  signature: $sig_macos
                },
                "darwin-x86_64": {
                  url: ($base_url + "/" + $macos_bundle),
                  signature: $sig_macos
                },
                "linux-x86_64": {
                  url: ($base_url + "/" + $linux_bundle),
                  signature: $sig_linux
                },
                "windows-x86_64": {
                  url: ($base_url + "/" + $windows_bundle),
                  signature: $sig_windows
                }
              }
            }' > releases-repo/desktop/latest.json

      - name: Commit and push to releases repo
        working-directory: releases-repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASES_PUSH_TOKEN }}@github.com/beebeeb-io/releases.git"
          git add desktop/latest.json
          git diff --cached --quiet || git commit -m "desktop: update manifest ${{ github.event.release.tag_name }}"
          git push
