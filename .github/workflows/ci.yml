name: Desktop CI

# Every PR and every push to main is built and tested on all three desktop
# targets. Before this workflow the only CI was release.yml (workflow_dispatch),
# so the Windows/Linux `#[cfg(...)]` code paths (windows_cf, linux_fuse, the
# Windows Credential Manager store) were first compiled at release time.
#
# Job names are stable on purpose: branch protection requires them by name.
#
# The job "Frontend (bun test + tsc + eslint)" was removed from this line for 0.9.0 by owner ruling 2026-11-12:
# the app has no web view. The React suite still runs on `main` for the 0.8.x line. The React sources and package
# files stay (the Tauri shell builds from them until the Mac port exists). The two core pin steps that job also
# ran are Rust checks, not React ones: they now run in "Changed areas".

on:
  pull_request:
  push:
    # The long-lived base branches: their pushes are the only runs that SAVE the Rust dependency cache, which
    # every pull request against them restores (.github/actions/rust-suite).
    branches: [main, v2-next, v2-native]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which areas the change touches (scripts/ci-changed-areas.py; it fails open). A pull request that changes only
  # docs, design files or the native UI crates does not run the Tauri engine suite: the three Rust jobs are then
  # SKIPPED, and a skipped job satisfies a required check, so the job names below still report. A push runs everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit: parent 1 is the base, so two commits hold the diff.
          fetch-depth: 2

      - name: Classifier self-test
        run: python3 scripts/ci-changed-areas.py --self-test

      - name: Classify the changed paths
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          list="$RUNNER_TEMP/changed-paths.txt"
          : > "$list"
          # Only a pull request's merge commit (two parents) gives a trustworthy list; anything else leaves the
          # list empty, and an empty list runs every area.
          if [ "$EVENT_NAME" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            # --no-renames: a file moved out of src-tauri into docs/ must be listed under its old path too.
            git diff --name-only --no-renames HEAD^1 HEAD > "$list" || : > "$list"
          fi
          echo "changed paths: $(wc -l < "$list")"
          python3 scripts/ci-changed-areas.py "$list" | tee -a "$GITHUB_OUTPUT"

      # Moved here from the removed Frontend job (see the top of this file): this job runs on every event and
      # needs no toolchain. After the classifier, so a failing pin never leaves `rust` unset.
      - name: Core pin check self-test
        run: sh scripts/check-core-pin.sh --self-test

      - name: Core pin check (src-tauri and windows pin the same core rev)
        run: sh scripts/check-core-pin.sh

  # The three Rust jobs share .github/actions/rust-suite: compile every target ONCE, run the tests, assert the
  # counted truth line, upload the evidence. `runs-on` reads a repository variable, so a job moves to a self-hosted
  # runner without a code change; a pull request from a fork always stays on a GitHub-hosted runner
  # (docs/ci/self-hosted-runners.md: that expression is a convenience, the security is the repository setting).
  # `needs.changes.outputs.rust != 'false'`: the suite is skipped only when the classifier positively said so; a
  # failed or cancelled classifier runs it.
  rust-linux:
    name: Rust test (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUST_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # A self-hosted runner has these installed once (docs/ci/self-hosted-runners.md) and has no sudo.
      - name: Install Linux dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libfuse-dev

      - name: Rust suite
        uses: ./.github/actions/rust-suite
        with:
          evidence-name: rust-test-linux
          cache-key: desktop-linux

  # The native updater (crates/beebeeb-updater): its rules decide what an install will run, so a pull request that
  # weakens one fails here, not at the next release. The count line is asserted: a run without tests is a failure.
  updater:
    name: Updater crate (tests, Windows check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Test, lint and cross-check
        working-directory: crates/beebeeb-updater
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --features net 2>&1 | tee "$RUNNER_TEMP/updater-test.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/updater-test.log"
          cargo clippy --locked --all-targets --features net -- -D warnings
          cargo check --locked --features net --target x86_64-pc-windows-msvc
          test "$(cargo tree --locked -e normal --features net | grep -c tauri)" -eq 0

      - name: Release script self-tests
        run: |
          set -euo pipefail
          bash scripts/publish-release-files.sh --self-test
          bash scripts/native-release-ref-check.sh --self-test

  # The updater's Windows-only rules (the staged installer is held so that nothing can replace it between the check
  # and the start) exist only under cfg(windows): they are tested where they exist. Each test is named, so a run in
  # which they were filtered out or compiled away is a failure. A hosted runner, no secret, no environment.
  updater-windows:
    name: Updater crate (Windows-only tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Test on Windows
        working-directory: crates/beebeeb-updater
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --features net 2>&1 | tee "$RUNNER_TEMP/updater-test-windows.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/updater-test-windows.log"
          for name in \
            'host::tests::a_held_installer_cannot_be_written_replaced_renamed_or_deleted' \
            'machine_tests::the_staged_file_cannot_be_replaced_between_the_check_and_the_start'; do
            grep -Fxq "test $name ... ok" "$RUNNER_TEMP/updater-test-windows.log" || { echo "::error::$name did not run"; exit 1; }
          done

  # Windows and macOS are two jobs, not a matrix: a skipped matrix job reports under its unexpanded name and would
  # leave the required "Rust check (Windows)" / "Rust check (macOS)" checks waiting for ever.
  # Task 2272 / 2271: macOS runs the tests too. The 0.8.18 release found a macOS-only test failure on the
  # maintainer's Mac that this job would have caught.
  rust-windows:
    name: Rust check (Windows)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'windows-latest') || vars.RUST_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Rust suite
        uses: ./.github/actions/rust-suite
        with:
          evidence-name: rust-Windows
          cache-key: desktop-windows

  rust-macos:
    name: Rust check (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-latest') || vars.RUST_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Rust suite
        uses: ./.github/actions/rust-suite
        with:
          evidence-name: rust-macOS
          cache-key: desktop-macos

  fileprovider-swift:
    # Task 1670 issue 3: until this job existed, NO CI step compiled the File
    # Provider extension's Swift (the Rust jobs compile no Swift; the
    # extension was first built at release time, on a developer's Mac). It now
    # compiles on every PR, unsigned and without secrets, and runs the pure
    # Foundation framing tests with a COUNTED truth line.
    name: File Provider Swift (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Swift toolchain
        run: |
          xcrun swiftc --version
          xcodebuild -version

      - name: Framing test count guard self-test
        run: bash scripts/test-ipc-framing.sh --self-test

      # XPCBridge.swift is not compiled into the swiftc test harness, so the
      # Swift tests cannot see a call site reverted to the default 30 s IPC
      # timeout. This source-level check does (and its self-test proves it can
      # go red).
      - name: IPC timeout call-site guard self-test
        run: python3 scripts/check-ipc-timeouts.py --self-test

      - name: IPC timeout call-site guard
        run: python3 scripts/check-ipc-timeouts.py

      - name: IPC framing tests (swiftc, pure Foundation)
        env:
          IPC_FRAMING_TEST_OUT: ${{ runner.temp }}/ipc-framing-tests
        run: bash scripts/test-ipc-framing.sh

      # `!cancelled()` so a red test step still lets the compile step report
      # its own verdict (they are independent failures).
      - name: Compile the File Provider extension (unsigned, ad-hoc codesign)
        if: ${{ !cancelled() }}
        env:
          # No signing identity, no provisioning profile, no secrets: the
          # script falls back to an ad-hoc signature.
          APPLE_SIGNING_IDENTITY: ""
        run: |
          set -o pipefail
          bash scripts/build-fileprovider-extension.sh \
            --out "$RUNNER_TEMP/fileprovider/BeebeebFileProvider.appex" \
            --helper-out "$RUNNER_TEMP/fileprovider/BeebeebFileProviderCtl" 2>&1 | tee "$RUNNER_TEMP/fileprovider-build.log"

      - name: Upload File Provider Swift evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fileprovider-swift
          path: |
            ${{ runner.temp }}/ipc-framing-tests/run.log
            ${{ runner.temp }}/ipc-framing-tests/run.exit
            ${{ runner.temp }}/fileprovider-build.log

  release-script:
    # scripts/release-macos-local.sh is the ONE command Guus runs on a Mac to turn the
    # CI-created desktop-v<VERSION> release into a macOS release (notarize, staple,
    # rebuild the dmg from the stapled app, upload, sign, backfill the manifest). It
    # cannot run here, but its ORDER and its fail-closed gates can: the test puts shims
    # for xcrun/codesign/spctl/hdiutil/ditto/plutil/gh/bunx on PATH and runs the real
    # script against a throwaway repo. The truth line is a count
    # ("release-macos-local: N passed, 0 failed"), guarded by a self-test that goes red.
    name: macOS release script (shim test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: shellcheck (warnings and above)
        run: |
          shellcheck --version
          shellcheck -S warning -x \
            scripts/release-macos-local.sh \
            scripts/test-release-macos-local.sh \
            scripts/fixtures/release-macos-shim.sh \
            scripts/macos-release-preflight.sh \
            scripts/release-blockers-check.sh \
            scripts/test-release-blockers-check.sh

      - name: Release blockers checker self-test
        run: bash scripts/test-release-blockers-check.sh --self-test

      - name: Release blockers checker test (real checker)
        run: |
          set -o pipefail
          bash scripts/test-release-blockers-check.sh 2>&1 | tee "$RUNNER_TEMP/blocker-check-test.log"

      - name: Upload release blockers checker test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocker-check-test
          path: ${{ runner.temp }}/blocker-check-test.log

      - name: Count guard self-test
        run: bash scripts/test-release-macos-local.sh --self-test

      - name: Release script test (shims, real script)
        run: |
          set -o pipefail
          bash scripts/test-release-macos-local.sh 2>&1 | tee "$RUNNER_TEMP/release-script-test.log"

      - name: Upload release script test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-script-test
          path: ${{ runner.temp }}/release-script-test.log

  release-manifest:
    # release.yml's "Generate desktop channel manifest" step writes the alpha/beta/stable
    # manifests every installed app updates from. The test runs that step's own run: block
    # against fixture releases with a fake gh on PATH (no network), and proves it fails closed:
    # a half-present macOS release, a missing or empty signature, or a download that keeps
    # failing writes no manifest. The truth line is a count
    # ("release-channel-manifest: N passed, 0 failed"), asserted on the run's own log by the
    # same count guard its self-test proves can go red. A red run prints each failing
    # scenario's step output and call log.
    name: Release channel manifest (fake gh test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: shellcheck (warnings and above)
        run: |
          shellcheck --version
          shellcheck -S warning -x \
            scripts/test-release-channel-manifest.sh \
            scripts/fixtures/release-manifest-fake-gh.sh
          bash scripts/test-release-channel-manifest.sh --print-step > "$RUNNER_TEMP/manifest-step.sh"
          test -s "$RUNNER_TEMP/manifest-step.sh"
          shellcheck -s bash -S warning "$RUNNER_TEMP/manifest-step.sh"

      - name: Count guard self-test
        run: bash scripts/test-release-channel-manifest.sh --self-test

      - name: Manifest step test (fake gh, real step)
        run: |
          set -o pipefail
          bash scripts/test-release-channel-manifest.sh 2>&1 | tee "$RUNNER_TEMP/release-manifest-test.log"

      - name: Count guard on the run's own log
        run: bash scripts/test-release-channel-manifest.sh --assert-log "$RUNNER_TEMP/release-manifest-test.log"

      - name: Upload manifest step test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-test
          path: ${{ runner.temp }}/release-manifest-test.log

  release-branch-point:
    # release.yml's `verify-branch-point` job refuses a release/* branch whose starting commit
    # was never reviewed (task 2281): the branch must start at a commit on main or at the commit
    # of a published desktop-v* tag that is itself a pull request merge into main or a release/*
    # branch, and every first-parent commit since then must be a pull request merged
    # into that branch. This job tests the script offline against a real local git repository with
    # a fake `gh`: a tag on a PR merge into a release branch, a tag on a PR merge into main, a
    # main start, an unreviewed start, a direct (non-PR) commit, a tag on a direct commit, a PR
    # merged into another branch, a tag on a PR merge into a feature branch, a non-release ref, a
    # tag with no release, a draft release, a failing release lookup and a failing pulls lookup.
    # The truth line is a count
    # ("release-branch-point: N passed, 0 failed"), asserted on the run's own log by the same
    # count guard its self-test proves can go red.
    name: Release branch point (fake gh test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: shellcheck (warnings and above)
        run: |
          shellcheck --version
          shellcheck -S warning -x \
            scripts/verify-release-branch-point.sh \
            scripts/test-release-branch-point.sh \
            scripts/fixtures/release-branch-point-fake-gh.sh

      - name: Count guard self-test
        run: bash scripts/test-release-branch-point.sh --self-test

      - name: Branch point test (fake gh, real git)
        run: |
          set -o pipefail
          bash scripts/test-release-branch-point.sh 2>&1 | tee "$RUNNER_TEMP/release-branch-point-test.log"

      - name: Count guard on the run's own log
        run: bash scripts/test-release-branch-point.sh --assert-log "$RUNNER_TEMP/release-branch-point-test.log"

      - name: Upload branch point test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-branch-point-test
          path: ${{ runner.temp }}/release-branch-point-test.log

  # ── The engine crate and the native Rune app (PR #280) ────────────────────────────────────────────────────────
  # Self-contained jobs, kept at the end of the file on purpose: `ci/fast-rust-jobs` is restructuring the jobs
  # above, and these three share no step with them. `crates/beebeeb-engine` holds tests that left `src-tauri`
  # (331 on Linux when it moved), so without these jobs they would run nowhere.

  engine-crate:
    name: Engine crate test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # The running engine moved in (step 2): its Linux mount links libfuse.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libfuse-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: crates/beebeeb-engine

      - name: Test count guard self-test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" scripts/assert-cargo-test-counts.py --self-test

      # The engine's OS-gated code (Windows Cloud Files rows, the macOS release journal) compiles and runs here on
      # its own OS; the shell's tests reach it only with the `test-support` feature on.
      - name: Run the engine crate's tests
        working-directory: crates/beebeeb-engine
        shell: bash
        env:
          TEMP: ${{ runner.temp }}/beebeeb-tmp
          TMP: ${{ runner.temp }}/beebeeb-tmp
          TMPDIR: ${{ runner.temp }}/beebeeb-tmp
        run: |
          mkdir -p "$TMPDIR"
          cargo_exit=0
          CARGO_TERM_COLOR=never cargo test --locked > "$RUNNER_TEMP/engine-test.log" 2>&1 || cargo_exit=$?
          cat "$RUNNER_TEMP/engine-test.log"
          echo "$cargo_exit" > "$RUNNER_TEMP/engine-test.exit"
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          # The library binary must be in the log and at or above its floor (scripts/cargo-test-floors.txt).
          "$py" ../../scripts/assert-cargo-test-counts.py "$RUNNER_TEMP/engine-test.log" --cargo-exit-code "$cargo_exit" --expect deps/beebeeb_engine-

      - name: Upload engine test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/engine-test.log
            ${{ runner.temp }}/engine-test.exit

  engine-boundary:
    name: Engine boundary (no tauri, test-support dev-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # 1.99.1: the native crate's lock and manifests need it; it reads the other two as well.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1

      # From cargo's dependency graph only (no build): `cargo tree -p beebeeb-engine | grep -c tauri` is 0, and the
      # engine's test-support feature is on no normal or build edge of the desktop app or the native app.
      - name: Engine boundary check
        run: sh scripts/check-engine-boundary.sh

      # A release build with the test helpers on does not compile (`compile_error!` in the engine's lib.rs).
      - name: test-support refuses a release build
        working-directory: crates/beebeeb-engine
        run: |
          if cargo check --locked --release --features test-support > "$RUNNER_TEMP/release-test-support.log" 2>&1; then
            echo "a release build with test-support compiled"; exit 1
          fi
          grep -q "test-support is for tests only" "$RUNNER_TEMP/release-test-support.log" || { cat "$RUNNER_TEMP/release-test-support.log"; echo "it failed for another reason"; exit 1; }
          echo "refused: $(grep -c 'test-support is for tests only' "$RUNNER_TEMP/release-test-support.log") compile_error line(s)"

  native-rune:
    name: Native Rune app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux test
            os: ubuntu-latest
          - name: Windows build
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Headless rendering needs a Vulkan driver: Mesa's software one (lavapipe). There is no GPU on the runner, so
      # a test that renders and finds no adapter fails; none is skipped for it.
      - name: Install Linux dependencies (software Vulkan, window system headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libfontconfig1-dev pkg-config libfuse2 libfuse-dev

      # Rune needs 1.99.1 (native/beebeeb-drive-rune/Cargo.toml).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: native/beebeeb-drive-rune

      - name: Run the native app's tests (Linux)
        if: runner.os == 'Linux'
        working-directory: native/beebeeb-drive-rune
        env:
          TMPDIR: ${{ runner.temp }}/beebeeb-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          cargo_exit=0
          CARGO_TERM_COLOR=never cargo test --locked > "$RUNNER_TEMP/native-test.log" 2>&1 || cargo_exit=$?
          cat "$RUNNER_TEMP/native-test.log"
          echo "$cargo_exit" > "$RUNNER_TEMP/native-test.exit"
          # The crate has no library: its one test binary is named, must be in the log, and has a floor.
          python3 ../../scripts/assert-cargo-test-counts.py "$RUNNER_TEMP/native-test.log" --cargo-exit-code "$cargo_exit" --expect deps/beebeeb_drive-

      - name: Build the native app (Windows)
        if: runner.os == 'Windows'
        working-directory: native/beebeeb-drive-rune
        shell: bash
        run: |
          build_exit=0
          CARGO_TERM_COLOR=never cargo build --locked > "$RUNNER_TEMP/native-build.log" 2>&1 || build_exit=$?
          cat "$RUNNER_TEMP/native-build.log"
          [ "$build_exit" -eq 0 ] || exit "$build_exit"
          ls -l "${CARGO_TARGET_DIR:-target}/debug/beebeeb-drive.exe"

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-rune-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/native-test.log
            ${{ runner.temp }}/native-test.exit
            ${{ runner.temp }}/native-build.log
          if-no-files-found: ignore
