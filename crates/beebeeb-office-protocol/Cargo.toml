[package]
name = "beebeeb-office-protocol"
version = "0.1.0"
edition = "2024"
publish = false
description = "The messages between the app and the Office helper, and the checks the app runs on every answer. No dependencies."
license = "AGPL-3.0-or-later"

# Design: docs/superpowers/specs/2026-11-12-native-office-viewer.md (§5.2 limits, §5.3 transport and untrusted answers, §7).
# Rules:
#   - no dependency of any kind: the codec is plain std, so nothing here can open a socket, a file or a process;
#   - platform-neutral: the app (every OS) and the helper both link it;
#   - the lockfile is generated by the integration lane, not written by hand.

# Its own workspace: this crate is built and tested on its own, like the sandbox crate next to it.
[workspace]
