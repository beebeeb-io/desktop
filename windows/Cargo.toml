[package]
name = "beebeeb-desktop-windows"
version = "0.1.0"
edition = "2024"
description = "Beebeeb desktop sync daemon for Windows"
publish = false

[dependencies]
beebeeb-sync = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-sync", rev = "d3b40e336acbbbbe34e0e793c840834fdb7f683b" }
beebeeb-core = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-core", rev = "d3b40e336acbbbbe34e0e793c840834fdb7f683b" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
anyhow = "1"
