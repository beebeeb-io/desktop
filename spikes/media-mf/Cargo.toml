# Spike M10 (decision 2540, D-MED-1): can Media Foundation decode inside the media helper's sandbox?
# A standalone, throwaway crate: NOT a member of any workspace, not built by CI, never merged into the product.
# It links the product's sandbox crate unchanged (path dependency) so the "confined" column is exactly the
# sandbox the helper would get. Results: REPORT.md next to this file.
[package]
name = "media-mf-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
beebeeb-office-sandbox = { path = "../../crates/beebeeb-office-sandbox" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# `#[implement]` expands to paths under `windows_core`, so the crate is named directly.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The decoder side: started with no arguments, one request on its standard input, lines on its standard output.
[[bin]]
name = "media-mf-probe"
path = "src/probe.rs"

# The driver: starts the probe per file and per column (unconfined, unconfined with the sandbox's environment,
# confined) and prints what each run said.
[[bin]]
name = "media-mf-run"
path = "src/run.rs"

[workspace]
