# THROWAWAY (task 2477): the cargo-deny policy used to COUNT what is in the three upstream workspaces.
# Run on each whole upstream workspace it is expected to fail on `bans` (their apps talk to the network);
# the gate that matters later is this same policy on our viewer crate's graph, where bans must be 0.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive only. MPL-2.0, LGPL and anything else is REPORTED, so a person decides.
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD", "OFL-1.1", "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Network clients, TLS stacks, socket layers and async runtimes: none may be in the viewer's graph.
deny = [
    { crate = "reqwest" }, { crate = "ureq" }, { crate = "hyper" }, { crate = "h2" }, { crate = "curl" },
    { crate = "isahc" }, { crate = "attohttpc" }, { crate = "tiny_http" }, { crate = "tungstenite" },
    { crate = "rustls" }, { crate = "native-tls" }, { crate = "openssl" }, { crate = "quinn" },
    { crate = "socket2" }, { crate = "mio" },
    { crate = "tokio" }, { crate = "async-std" }, { crate = "smol" }, { crate = "async-io" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
