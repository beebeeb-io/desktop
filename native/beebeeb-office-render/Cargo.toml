[package]
name = "beebeeb-office-render"
version = "0.0.1"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "The sandboxed Office viewer helper: renders the document it is handed, nothing else"

# Design: docs/superpowers/specs/2026-11-12-native-office-viewer.md (§5.2 limits, §5.3 transport, §7 messages).
# Rules:
#   - the helper reads its two pipes and the sections it is granted, and nothing else: no argument, no environment
#     variable, no file, no socket, no child process, no logger;
#   - its standard output is the protocol; its standard error is not connected (the sandbox crate);
#   - the lockfile is written by the integration lane, not by hand.

# Its own workspace: built and tested on its own, like the protocol and sandbox crates it links.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "beebeeb-office-render"   # fixed: the latency test uses env!("CARGO_BIN_EXE_beebeeb-office-render"), the host's helper_exe() this name
path = "src/main.rs"
# main.rs has no tests of its own (the library's and tests/ hold them): no empty test binary in the count. The
# integration tests still build this binary and get its path.
test = false

[dependencies]
beebeeb-office = { git = "https://github.com/beebeeb-io/desktop-office", rev = "dc394dec15a9d540f3ffdbeb79a1b275e1993a20" }
beebeeb-office-protocol = { path = "../../crates/beebeeb-office-protocol" }
beebeeb-office-sandbox = { path = "../../crates/beebeeb-office-sandbox" }
log = "0.4"   # only for the no-logger check (`log::max_level()`); already in the Office engine's closure

[profile.release]
panic = "abort"

# The engines' upstream workspaces patch krilla (PDF export) to the craft-libs fork; a [patch] in a dependency
# is not read here, so it is repeated. Same rev as in desktop-office's wordcraft/Cargo.toml.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
