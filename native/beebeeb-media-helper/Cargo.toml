filmcraft-matroska = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-media = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-mpa = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-mpeg2v = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-mpegts = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-mxf = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-ogg = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-opus = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
