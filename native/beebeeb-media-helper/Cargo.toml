[package]
name = "beebeeb-media-helper"
version = "0.0.1"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Decodes one audio or video file inside the sandbox: no key, no name, no path, no network. Bytes in by range, frames and PCM out."

# Design: the media plan's (d) "Sandbox" (decision D-MED-3): every parser and decoder of a media file runs in this
# process, started confined by `crates/beebeeb-office-sandbox`, never in the app that holds the keys.
# Rules:
#   - its own workspace, its own `Cargo.lock` and `deny.toml` (the closure audited on its own: `cargo deny check
#     licenses bans sources` here; 13 MPL-2.0 exceptions, the `symphonia` 0.5.5 crates, decision D-MED-10);
#   - dependencies: the protocol and FilmCraft, nothing else (no direct `symphonia`: FilmCraft brings 0.5.5, a second
#     version would add 15 more MPL-2.0 packages);
#   - `panic = "abort"`: a panic ends the process, and the app sees its pipe close.

[lib]
name = "beebeeb_media_helper"
path = "src/lib.rs"

[[bin]]
name = "beebeeb-media-helper"
path = "src/main.rs"

[dependencies]
beebeeb-media-protocol = { path = "../../crates/beebeeb-media-protocol" }
filmcraft-codecs = "=0.9.0"
filmcraft-media = "=0.9.0"

# Decision D-MED-11 (supply chain): FilmCraft's 26 crates are taken from the Office engine's repository, where they are
# vendored at the pin as the unmodified crates.io tarballs (the rule of its subtrees), never from crates.io. A bump is
# its own pull request there, with the diff of every crate this helper links, and then a new `rev` here.
# `rev`: the vendoring commit. VENDOR-PIN-PENDING until that commit exists (the one check fills all 26 lines).
[patch.crates-io]
filmcraft-aac = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-ac3 = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-apv = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-av1 = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-avi = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-bitstream = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-codecs = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-color = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-dng = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-dnx = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-frame = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-h264 = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
filmcraft-hevc = { git = "https://github.com/beebeeb-io/desktop-office", rev = "VENDOR-PIN-PENDING" }
