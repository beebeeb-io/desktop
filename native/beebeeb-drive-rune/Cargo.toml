[package]
name = "beebeeb-drive-rune"
version = "0.0.1"
edition = "2024"
publish = false

# Rune needs Rust 1.99.1 (edition 2024 + language features it uses).
# This crate is its own workspace root, with its own `rust-toolchain.toml`; CI builds it with 1.99.1.

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "c92e462e", default-features = false, features = ["accessibility"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c92e462e" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "c92e462e" }
# The engine without Tauri: the real `DriveSource` (`src/source_engine.rs`) reads a state.db through it.
# `default-features = false` (task 2488): without the engine's `direct-state-db` the state database's constructors
# are not `pub`, so this crate reaches the local state through `Engine::local_state` (the account-bound handle) or
# it does not compile. Tests build fixtures with the engine's writers (`test-support`, dev-dependencies only).
beebeeb-engine = { path = "../../crates/beebeeb-engine", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The sign-in source hands secrets to the engine as Zeroizing<String> (wiped on drop).
zeroize = "1"
# The QR code of the two-factor set-up (engine_host/account_twofactor.rs): MIT or Apache-2.0, pure Rust, no network;
# the same crate and version the Tauri app already uses. Only the modules are read, no image or SVG output.
qrcode = { version = "0.14", default-features = false }
# Checks `--api-base` (`engine_host/open.rs`) with the parser reqwest connects with; already in the lock through
# the engine's reqwest, so no new crate is built.
url = "2"
# The updater (`engine_host/settings/updates.rs`): the signed manifest, the version policy and the download, verify and
# hand-off machine; no Tauri, no UI. Its https client (feature `net`) is linked on Windows only, the one platform with
# a release line; the same reqwest 0.12 the engine builds, with its `blocking` client.
beebeeb-updater = { path = "../../crates/beebeeb-updater" }
# In-app playback (`media/`): the messages to and from the sandboxed media helper (no dependencies of its own), and
# the sandbox that starts the helper confined (the Office helper's; `windows-sys` 0.61 is already in the lock).
beebeeb-media-protocol = { path = "../../crates/beebeeb-media-protocol" }
# The Office viewer's helper (`engine_host/office_host.rs`): starts it confined and checks every answer it gives. Both
# crates are ours; the protocol has no dependency, the sandbox links windows-sys on Windows only.
beebeeb-office-sandbox = { path = "../../crates/beebeeb-office-sandbox" }
beebeeb-office-protocol = { path = "../../crates/beebeeb-office-protocol" }

serde_json = "1"
# The local log file's subscriber (`log_file.rs`): the `tracing` the engine already logs through; already in the lock
# through the engine, so no new crate is built (no `tracing-subscriber`: the subscriber is this crate's own).
tracing = "0.1"
# Parses Markdown for the viewer (`frames/viewers/markdown.rs`): MIT, pure Rust, no network, no HTML output.
pulldown-cmark = { version = "0.13", default-features = false }
# Renders a PDF's pages for the viewer (`engine_host/viewer_pdf.rs`): pure Rust (no C or C++ is compiled, no `-sys`
# crate in its tree), Apache-2.0 OR MIT, from bytes in memory, no file or network access of its own. Pinned to the
# exact version that was measured (a 0.x crate with breaking releases). Its default features bundle the 14 standard
# Latin fonts and the CMap tables (both BSD-3-Clause; their notices are in `THIRD-PARTY-NOTICES.md`, which a
# release has to carry with the app).
hayro = "=0.9.0"
# Decodes the bundled b glyph for the notification-area icons (`shell/tray_icon.rs`).
png = "0.18"
# Only for the `feedback` feature: names the surface format and device types of the capture;
# the same wgpu rune already builds (no new crate is compiled).
wgpu = { version = "30", default-features = false, optional = true }

[features]
# Development and diagnostic flags in a RELEASE build (Rune's `--snap`, `--out`, `--html`,
# `--script`, …, and `--db`). Debug builds have them without it. A shipped build is built
# without this feature and ignores every one of them (`shell/instance.rs`: `DEV_BUILD`).
dev-tools = ["beebeeb-engine/dev-viewer"]
# Live feedback mode (src/feedback/): on for test builds, OFF for release.
feedback = ["dep:wgpu"]

[target.'cfg(windows)'.build-dependencies]
# Compiles the exe's version resource and icon (`build.rs`, `build_version.rs`). A build tool only: nothing of it is
# linked into the app and it makes no network call. MIT licence. Chosen over hand-calling rc.exe because it finds the
# Windows SDK / MSVC resource compiler itself (vswhom, registry), which the windows-latest runner and VM 401 both have.
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
# The same windows-sys Rune builds with: the notification-area icon, the registry Run value,
# the taskbar's mode and the control channel's named pipe (`shell/platform/windows*.rs`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Names the Win32 window handle Rune's `WindowHandle::with_raw_handle` lends.
raw-window-handle = "0.6"
# Windows Hello's prompt is a WinRT API (`shell/platform/windows_hello.rs`), which windows-sys does not have. The
# same `windows` the engine already builds: no new crate is compiled.
# The first run's folder picker is a COM dialog (`shell/platform/windows_folder.rs`): three more features of it.
# Toasts are WinRT (`shell/platform/windows_toast.rs`: UI_Notifications, Data_Xml_Dom, the shortcut's app id through
# Win32_UI_Shell_PropertiesSystem); File Explorer's menu items are registry keys (`shell/platform/windows_verbs.rs`).
# The media controls of Windows (`media/os_controls.rs`: System Media Transport Controls, the picture from memory
# through an in-memory stream): `Media`, `Storage_Streams`.
windows = { version = "0.58", features = ["ApplicationModel_DataTransfer", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Storage", "Storage_Search", "Media", "Security_Credentials_UI", "Storage_Streams", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
# The updater's https client (`net`): Windows only (see `beebeeb-updater` above).
beebeeb-updater = { path = "../../crates/beebeeb-updater", features = ["net"] }

# The sound of in-app playback (`media/audio_out.rs`): WASAPI on Windows, CoreAudio on macOS. Not on Linux, where it
# would need ALSA on the test machine: the player's tests run on a null sink there. Apache-2.0; pinned to the version
# the media plan measured.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "=0.18.2"

[dev-dependencies]
# `engine_host` tests open the engine on credential stores in memory, with the settings file in the engine's test
# sandbox and a closed loopback port as the default API: no test of this crate reaches the OS credential store,
# the person's settings or the production API. Dev-only (`scripts/check-engine-boundary.sh` refuses it elsewhere).
beebeeb-engine = { path = "../../crates/beebeeb-engine", default-features = false, features = ["test-support"] }
# `source_engine` tests build a state.db with the engine's own writers.
tempfile = "3"
# The updater's test doubles (`testkit`): a signing key made inside each test, a scripted release server on no
# network, a clock and a store. No test of this crate reaches the release server.
beebeeb-updater = { path = "../../crates/beebeeb-updater", features = ["testkit"] }
# The timing test asks SQLite for its query plan; same version the engine links.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
tokio = { version = "1", features = ["rt"] } # the tray tests hold a task in the engine's slot (`hold_running`)
# For headless golden-PNG tests.

[[bin]]
name = "beebeeb-drive"
path = "src/main.rs"

# The Linux test job crept toward its 45-minute limit: with a warm cache the build is about 40 s, the one test binary
# was the rest (985 tests in 678 s, then 1,076 tests in 1,779 s on 2026-11-13). The tests under `engine_host/` and
# `shell/` each sign an invented account in and unlock it through the engine, with core's production Argon2id
# parameters, and at opt-level 0 that is minutes per test (51 tests ran for over 60 s each). This crate is its own
# workspace root, so the same list in `crates/beebeeb-engine/Cargo.toml` does not reach it
# (docs/ci/2026-11-11-rust-ci-speed.md): these third-party crypto, KDF, hash and SQLite crates are compiled optimised
# in the dev and test profiles. No KDF parameter, no crypto code, no release setting changes; Cargo.lock is unchanged.
# A name that matches no package is a cargo warning.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.opaque-ke]
opt-level = 3
[profile.dev.package.voprf]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.fiat-crypto]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.bip39]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
# The PDF renderer and its rasterizer: a page at opt-level 0 takes seconds, and the viewer's tests render pages.
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package.hayro-interpret]
opt-level = 3
[profile.dev.package.hayro-syntax]
opt-level = 3
[profile.dev.package.hayro-font]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
