[package]
name = "beebeeb-drive-rune"
version = "0.0.1"
edition = "2024"
publish = false

# Rune needs Rust 1.99.1 (edition 2024 + language features it uses).
# The desktop repo's src-tauri/ pins to "stable" (currently 1.98.1 on this machine).
# This crate is a sibling, not a workspace member of src-tauri/, so it gets its own toolchain.
# During the migration both shells build side by side.

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "c92e462e", default-features = false, features = ["accessibility"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c92e462e" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "c92e462e" }
# The engine without Tauri: the real `DriveSource` (`src/source_engine.rs`) reads a state.db through it.
# `default-features = false` (task 2488): without the engine's `direct-state-db` the state database's constructors
# are not `pub`, so this crate reaches the local state through `Engine::local_state` (the account-bound handle) or
# it does not compile. Tests build fixtures with the engine's writers (`test-support`, dev-dependencies only).
beebeeb-engine = { path = "../../crates/beebeeb-engine", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The sign-in source hands secrets to the engine as Zeroizing<String> (wiped on drop).
zeroize = "1"
# Checks `--api-base` (`engine_host/open.rs`) with the parser reqwest connects with; already in the lock through
# the engine's reqwest, so no new crate is built.
url = "2"

serde_json = "1"
# Parses Markdown for the viewer (`frames/viewers/markdown.rs`): MIT, pure Rust, no network, no HTML output.
pulldown-cmark = { version = "0.13", default-features = false }
# Decodes the bundled b glyph for the notification-area icons (`shell/tray_icon.rs`).
png = "0.18"
# Only for the `feedback` feature: names the surface format and device types of the capture;
# the same wgpu rune already builds (no new crate is compiled).
wgpu = { version = "30", default-features = false, optional = true }

[features]
# Development and diagnostic flags in a RELEASE build (Rune's `--snap`, `--out`, `--html`,
# `--script`, …, and `--db`). Debug builds have them without it. A shipped build is built
# without this feature and ignores every one of them (`shell/instance.rs`: `DEV_BUILD`).
dev-tools = ["beebeeb-engine/dev-viewer"]
# Live feedback mode (src/feedback/): on for test builds, OFF for release.
feedback = ["dep:wgpu"]

[target.'cfg(windows)'.dependencies]
# The same windows-sys Rune builds with: the notification-area icon, the registry Run value,
# the taskbar's mode and the control channel's named pipe (`shell/platform/windows*.rs`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Names the Win32 window handle Rune's `WindowHandle::with_raw_handle` lends.
raw-window-handle = "0.6"

[dev-dependencies]
# `engine_host` tests open the engine on credential stores in memory, with the settings file in the engine's test
# sandbox and a closed loopback port as the default API: no test of this crate reaches the OS credential store,
# the person's settings or the production API. Dev-only (`scripts/check-engine-boundary.sh` refuses it elsewhere).
beebeeb-engine = { path = "../../crates/beebeeb-engine", default-features = false, features = ["test-support"] }
# `source_engine` tests build a state.db with the engine's own writers.
tempfile = "3"
# The timing test asks SQLite for its query plan; same version the engine links.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt"] } # the tray tests hold a task in the engine's slot (`hold_running`)
# For headless golden-PNG tests.

[[bin]]
name = "beebeeb-drive"
path = "src/main.rs"

# The Linux test job crept toward its 45-minute limit: with a warm cache the build is about 40 s, the one test binary
# was the rest (985 tests in 678 s, then 1,076 tests in 1,779 s on 2026-11-13). The tests under `engine_host/` and
# `shell/` each sign an invented account in and unlock it through the engine, with core's production Argon2id
# parameters, and at opt-level 0 that is minutes per test (51 tests ran for over 60 s each). This crate is its own
# workspace root, so the same list in `crates/beebeeb-engine/Cargo.toml` and `src-tauri/Cargo.toml` does not reach it
# (docs/ci/2026-11-11-rust-ci-speed.md): these third-party crypto, KDF, hash and SQLite crates are compiled optimised
# in the dev and test profiles. No KDF parameter, no crypto code, no release setting changes; Cargo.lock is unchanged.
# A name that matches no package is a cargo warning.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.opaque-ke]
opt-level = 3
[profile.dev.package.voprf]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.fiat-crypto]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.bip39]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
